# Construit la version Windows de l'application sur une machine Windows de GitHub,
# la vérifie, et l'ajoute à la Release (à chaque nouvelle Release, ou à la demande).
name: Version Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release à laquelle ajouter le zip Windows (ex. v1.0)"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Vérifier le code (avant construction)
        run: |
          python lanceur.py --verifier verif_source.txt
          $code = $LASTEXITCODE
          Get-Content verif_source.txt
          if ($code -ne 0) { exit 1 }

      - name: Construire l'application
        run: python construire_windows.py

      - name: Vérifier l'application construite (.exe)
        run: |
          $exe = "build_windows\dist\Analyse Actions\Analyse Actions.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--verifier", "$PWD\verif_exe.txt" -Wait -PassThru
          Get-Content verif_exe.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Garder le zip comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Analyse-Actions-Windows
          path: distribution/Analyse-Actions-Windows.zip

      - name: Ajouter le zip à la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$env:TAG" distribution/Analyse-Actions-Windows.zip --clobber --repo "${{ github.repository }}"
